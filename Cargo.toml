[package]
name = "tyvera"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "The Tyvera compiler and language tools"

[dependencies]
cranelift = "0.138.0"
cranelift-jit = "0.138.0"
cranelift-module = "0.138.0"
cranelift-native = "0.138.0"

[lib]
name = "tyvera"
path = "src/lib.rs"

[[bin]]
name = "tyvera"
path = "src/main.rs"
