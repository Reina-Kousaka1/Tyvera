name: Documentation issue
description: Report missing, unclear, or incorrect Tyvera documentation.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, credentials, private data, or `.tyvera.secrets` contents.
  - type: input
    id: location
    attributes:
      label: Page or file
      description: Link the page or name the repository path and section.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is missing or incorrect?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Include corrected wording or an example if you have one.
    validations:
      required: false
