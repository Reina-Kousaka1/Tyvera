name: Language Proposal / RFC
description: Discuss a substantial Tyvera syntax, semantics, type-system, runtime, or compiler design change.
title: "[RFC]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a design change with cross-cutting language or architecture consequences. Smaller library, tooling, or documentation ideas can use the Feature Request form. Filing an RFC starts discussion; it does not imply acceptance. **Never post tokens, passwords, credentials, or `.tyvera.secrets` contents.**
  - type: textarea
    id: motivation
    attributes:
      label: Problem and motivation
      description: What concrete limitation or use case motivates this proposal?
    validations:
      required: true
  - type: textarea
    id: syntax
    attributes:
      label: Proposed syntax and examples
      description: Show representative Tyvera code, including useful edge cases.
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Proposed semantics
      description: Explain typing, evaluation, errors, scope, and lifecycle behavior as applicable.
    validations:
      required: true
  - type: textarea
    id: type-system
    attributes:
      label: Type-system impact
      description: Consider inference, constraints, compatibility, and diagnostics.
    validations:
      required: false
  - type: textarea
    id: runtime
    attributes:
      label: Runtime and standard-library impact
      description: Include effects on actors, tasks, resources, and public APIs where relevant.
    validations:
      required: false
  - type: textarea
    id: compiler
    attributes:
      label: Compiler and backend impact
      description: Consider the current interpreter and future native backends.
    validations:
      required: false
  - type: textarea
    id: compatibility
    attributes:
      label: Backward compatibility
      description: Identify migration needs and whether existing programs change behavior.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and drawbacks
      description: Include rejected designs, complexity, costs, or other possible downsides.
    validations:
      required: true
