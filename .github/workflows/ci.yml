name: CI

on:
  push:
    branches: [Dev, feature/language-runtime-foundations, feature/linux-runtime-platform]
  pull_request:
    branches: [Dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CXX: g++
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify native C++ toolchain
        run: g++ --version

      - name: Install Tyvera
        run: python -m pip install --editable .

      - name: Verify Ubuntu platform foundation
        run: |
          python - <<'PY'
          from tyvera.platform_runtime import Architecture, OperatingSystem, detect_host_platform

          host = detect_host_platform()
          assert host.operating_system is OperatingSystem.LINUX, host
          assert host.architecture is Architecture.X86_64, host
          assert host.linux_architecture_supported, host
          PY
          tyvera check examples/platform_runtime.tyv
          tyvera run examples/platform_runtime.tyv
          env -u DISCORD_TOKEN tyvera check libraries/discord
          env -u DISCORD_TOKEN tyvera run libraries/discord

      - name: Run complete test suite
        run: python -m unittest discover -v

      - name: Check secret-file protection
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import PurePosixPath

          tracked = subprocess.run(
              ["git", "ls-files", "-z"], check=True, capture_output=True
          ).stdout.decode("utf-8").split("\0")
          if any(PurePosixPath(path).name == ".tyvera.secrets" for path in tracked if path):
              sys.exit("A .tyvera.secrets file is tracked; remove it and rotate any exposed values.")

          ignored = subprocess.run(
              ["git", "check-ignore", "--quiet", "--no-index", ".tyvera.secrets"]
          )
          if ignored.returncode != 0:
              sys.exit(".gitignore must ignore .tyvera.secrets.")

          example = subprocess.run(
              ["git", "check-ignore", "--quiet", "--no-index", ".tyvera.secrets.example"]
          )
          if example.returncode == 0:
              sys.exit(".gitignore must leave .tyvera.secrets.example available for safe examples.")
          if example.returncode != 1:
              sys.exit("Could not verify the .tyvera.secrets.example ignore rule.")
          PY

      - name: Check and run every executable example
        shell: bash
        run: |
          set -euo pipefail
          tyvera --version
          tyvera check hello.tyv
          tyvera run hello.tyv
          for source in examples/*.tyv; do
            test -f "$source"
            tyvera check "$source"
            tyvera run "$source"
          done
          for source in libraries/discord/examples/*.tyv; do
            test -f "$source"
            env -u DISCORD_TOKEN tyvera check "$source"
            env -u DISCORD_TOKEN tyvera run "$source"
          done

      - name: Smoke-test generated project
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory(prefix="tyvera-ci-") as temporary_directory:
              work = Path(temporary_directory)
              subprocess.run(["tyvera", "new", "ci_smoke"], cwd=work, check=True)
              project = work / "ci_smoke"
              subprocess.run(["tyvera", "check", str(project)], check=True)
              subprocess.run(["tyvera", "run", str(project)], check=True)
          PY

  ubuntu-package:
    name: Ubuntu 24.04 package install and upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Debian packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools

      - name: Build, install, upgrade, reinstall, remove, and purge
        shell: bash
        run: |
          set -euo pipefail

          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b
          package_a="$GITHUB_WORKSPACE/../tyvera_0.1.0-1_all.deb"
          test -f "$package_a"
          package_a_hash="$(sha256sum "$package_a" | cut -d ' ' -f 1)"
          dpkg-buildpackage -us -uc -b
          repeated_hash="$(sha256sum "$package_a" | cut -d ' ' -f 1)"
          test "$package_a_hash" = "$repeated_hash"

          user_data="$HOME/.local/share/tyvera-package-smoke"
          mkdir -p "$user_data/project"
          cat > "$user_data/project/main.tyv" <<'TYV'
          fn main() {
              println("installed Tyvera works")
          }
          TYV
          printf '%s\n' 'preserve-user-project' > "$user_data/project/marker.txt"
          printf '%s\n' 'fake-local-secret-never-a-real-token' > "$user_data/project/.tyvera.secrets"

          sudo apt-get install -y "$package_a"
          tyvera --version
          tyvera check "$user_data/project"
          tyvera run "$user_data/project"
          test "$(cat "$user_data/project/marker.txt")" = 'preserve-user-project'
          test "$(cat "$user_data/project/.tyvera.secrets")" = 'fake-local-secret-never-a-real-token'

          sed -i '1s/0\.1\.0-1/0.1.0-2/' debian/changelog
          dpkg-buildpackage -us -uc -b
          package_b="$GITHUB_WORKSPACE/../tyvera_0.1.0-2_all.deb"
          test -f "$package_b"

          sudo apt-get install -y "$package_b"
          test "$(dpkg-query -W -f='${Version}' tyvera)" = '0.1.0-2'
          sudo apt-get install --reinstall -y "$package_b"
          tyvera check "$user_data/project"
          tyvera run "$user_data/project"

          sudo apt-get remove -y tyvera
          test -f "$user_data/project/main.tyv"
          test -f "$user_data/project/.tyvera.secrets"
          sudo apt-get purge -y tyvera
          test -f "$user_data/project/main.tyv"
          test -f "$user_data/project/marker.txt"
          test -f "$user_data/project/.tyvera.secrets"

          source_epoch="$(git log -1 --format=%ct HEAD)"
          orig_root="$RUNNER_TEMP/tyvera-orig"
          mkdir -p "$orig_root"
          git archive --format=tar --prefix=tyvera-0.1.0/ HEAD \
            | tar --exclude='tyvera-0.1.0/debian' -xf - -C "$orig_root"
          tar --sort=name --mtime="@$source_epoch" --owner=0 --group=0 \
            --numeric-owner -C "$orig_root" -cf - tyvera-0.1.0 \
            | gzip -n > "$GITHUB_WORKSPACE/../tyvera_0.1.0.orig.tar.gz"
          dpkg-buildpackage -S -us -uc
          test -f "$GITHUB_WORKSPACE/../tyvera_0.1.0-2.dsc"
